name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      # Run the purity contract as its own step so a violation is immediately
      # legible in the CI summary rather than buried in the full test output.
      # This is the project's foundational invariant: everything else depends
      # on the core being deterministic and I/O-free.
      - name: purity contract
        run: go test ./raft -run 'TestCoreHasNo' -count=1 -v

      - name: core dependency graph
        run: go list -deps ./raft | grep -v '^internal/'

      - name: test
        run: go test ./... -count=1

      # Real listeners, real gRPC, real leader kills.
      - name: cluster integration tests
        run: go test ./server/ -count=1 -v -timeout 300s

      # Real processes under real SIGKILL/SIGSTOP and cut sockets, checked for
      # linearizability. The second test in this package starts the cluster in a
      # deliberately broken configuration and requires the checker to catch it,
      # so a green chaos run means something.
      - name: real-cluster chaos and linearizability
        run: go test ./chaos/ -count=1 -v -timeout 600s

      - name: test (race)
        run: go test -race ./... -count=1

  # A failure here prints a single integer seed that reproduces it exactly.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: deterministic simulation soak
        run: |
          go run ./cmd/dst -soak -seeds=2000 -nodes=3 -parallel=4
          go run ./cmd/dst -soak -seeds=2000 -nodes=5 -parallel=4

      # Chaos: loss, duplication, reordering, partitions (incl. one-way),
      # crashes, restarts, stalls, clock drift. A failure prints one seed.
      - name: chaos soak
        run: |
          go run ./cmd/dst -soak -chaos -seeds=2000 -nodes=3 -parallel=4
          go run ./cmd/dst -soak -chaos -seeds=2000 -nodes=5 -parallel=4

      # Compaction turned up so far that InstallSnapshot, not replication,
      # becomes the normal catch-up path. At a production threshold that code
      # runs rarely and is effectively untested.
      - name: snapshot-heavy chaos soak
        run: |
          go run ./cmd/dst -soak -chaos -snapshot -seeds=2000 -nodes=3 -parallel=4
          go run ./cmd/dst -soak -chaos -snapshot -seeds=2000 -nodes=5 -parallel=4

      # Membership changes are the subtlest correctness case in Raft: a
      # configuration takes effect on append, so it can be truncated and must
      # roll back. Churned continuously alongside every other fault.
      - name: membership churn soak
        run: |
          go run ./cmd/dst -soak -chaos -membership -seeds=2000 -nodes=5 -parallel=4
          go run ./cmd/dst -soak -chaos -membership -snapshot -seeds=2000 -nodes=5 -parallel=4

      # Same scenario against real fsync'd files: fewer seeds, far higher
      # fidelity. Breadth comes from the in-memory soaks above.
      - name: chaos soak on a real write-ahead log
        run: go run ./cmd/dst -soak -chaos -snapshot -wal -seeds=50 -nodes=5 -parallel=4
